    <!-- Language detection and hash-based routing init -->
    <script>
      (function () {
        var hash = window.location.hash;
        if (!hash || hash === '#' || hash === '#/') {
          var lang = navigator.language && navigator.language.toLowerCase().startsWith('ja') ? 'ja' : 'en';
          window.location.replace(window.location.pathname + window.location.search + '#/' + lang + '/');
        }
      })();
    </script>
